name: Android app

# Builds the sideloadable APK from the web app and publishes it as a GitHub release.
on:
  push:
    branches: [main]
    paths: ["web/**", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build the web files
        working-directory: app
        run: |
          npm ci
          npm run www
          sed -i "s/const APP_BUILD = 0;/const APP_BUILD = ${{ github.run_number }};/" www/app.js
          grep -q "const APP_BUILD = ${{ github.run_number }};" www/app.js
          npx cap sync android
      - name: Build the APK
        working-directory: app/android
        env:
          SL_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../spore-leaf.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" spore-leaf.apk \
            --title "Spore & Leaf, build ${{ github.run_number }}" \
            --notes "Android app, build ${{ github.run_number }}. On your phone, download spore-leaf.apk and tap it to install. It installs over the previous build and keeps your finds. Never eat anything based on this app." \
            --latest
